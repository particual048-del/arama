name: Glutensiz Urun Kaziyici

on:
  schedule:
    # Her 5 saatte bir otomatik olarak tetiklenir (Kaldığı üründen devam eder)
    - cron: '0 */5 * * *'
  workflow_dispatch: # GitHub paneli üzerinden dilediğin zaman elle başlatabilmen için

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Kazıma Kodunu Çalıştır
        run: node index.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RENDER_GIT_REPO_SLUG: ${{ github.repository }}

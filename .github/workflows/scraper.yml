name: Glutensiz Urun Kaziyici

on:
  workflow_dispatch:

# Botun depoya otomatik push atabilmesi için gerekli yazma izni
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Kazıyıcıyı Çalıştır
        run: node index.js
